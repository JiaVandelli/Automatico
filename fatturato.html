<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Fatturato & Brogliaccio Filiali</title>
    <style>
        :root {
            --primary: #2C3E50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2C3E50;
            --border: #dcdfe6;
            --positive: #148f48;
            --positive-bg: #e8f8f0;
            --negative: #c0392b;
            --negative-bg: #fdedec;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
            font-size: 26px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save { background-color: #2980b9; color: white; }
        .btn-save:hover { background-color: #2471a3; }
        
        .btn-close { background-color: var(--accent); color: white; }
        .btn-close:hover { background-color: #219a52; }
        
        .btn-copy { background-color: #8e44ad; color: white; }
        .btn-copy:hover { background-color: #7d3c98; }

        .btn-reset { background-color: #95a5a6; color: white; margin-left: auto; }
        .btn-reset:hover { background-color: #7f8c8d; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            padding: 14px 12px;
            text-align: right;
            border: 1px solid var(--border);
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        th:first-child, td:first-child {
            text-align: left;
            font-weight: bold;
        }

        .row-master {
            background-color: #eaecee;
            font-weight: bold;
        }

        .row-auto {
            background-color: #f8f9fa;
        }

        .badge-auto {
            background: #e67e22;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
            font-weight: normal;
        }

        input[type="text"] {
            width: 120px;
            padding: 8px 10px;
            text-align: right;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2980b9;
            box-shadow: 0 0 4px rgba(41, 128, 185, 0.3);
            background-color: #fffbf0;
        }

        input:disabled {
            background-color: #e9ecef;
            color: #495057;
            border-color: #ced4da;
            cursor: not-allowed;
            font-weight: bold;
        }

        .totale-cell {
            cursor: pointer;
            position: relative;
            font-weight: bold;
            color: #2c3e50;
            text-decoration: underline dotted #95a5a6;
        }
        .totale-cell:hover::after {
            content: ' ✎';
            font-size: 12px;
            color: #2980b9;
        }

        .diff-cell {
            font-weight: bold;
            font-size: 15px;
        }
        .positive { color: var(--positive); background-color: var(--positive-bg); }
        .negative { color: var(--negative); background-color: var(--negative-bg); }
        .neutral { color: #7f8c8d; }

        #status {
            text-align: center;
            font-weight: bold;
            min-height: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Controllo Fatturato & Brogliaccio Filiali</h1>
    <p class="subtitle">Inserimento rapido senza perdita di focus • Automazione Italia attiva • Stampa e Copia Email ottimizzate</p>

    <div class="toolbar">
        <button class="btn-save" onclick="salvaDati(true)">💾 Salva Modifiche</button>
        <button class="btn-close" onclick="chiudiGiornata()">📅 Chiusura Giornata (Somma ad Accumulato)</button>
        <button class="btn-copy" onclick="copiaPerEmail()">📧 Copia per Email</button>
        <button class="btn-reset" onclick="resetDati()">🔄 Reset Dati</button>
    </div>

    <table id="fatturatoTable">
        <thead>
            <tr>
                <th>Filiale / Unità</th>
                <th>Fatturato Oggi (€)</th>
                <th>Totale Accumulato (€) <small style="font-weight:normal; display:block;">(Clicca per rettificare)</small></th>
                <th>Anno Scorso (€) <small style="font-weight:normal; display:block;">(Riferimento Storico)</small></th>
                <th>Confronto Anno Scorso (€)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- La tabella viene generata dal JS -->
        </tbody>
    </table>

    <div id="status"></div>
</div>

<script>
    // Formattatore per valuta e numeri italiani
    const currFmt = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
    const numFmt = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Modello Dati Iniziale
    const defaultData = {
        brogliaccio: { name: "TOTAL GENERALE (Brogliaccio)", oggi: 0, totalePrec: 0, annoScorso: 0, isMaster: true },
        spagna: { name: "Spagna", oggi: 0, totalePrec: 0, annoScorso: 0 },
        ig2: { name: "2IG", oggi: 0, totalePrec: 0, annoScorso: 0 },
        russia: { name: "Russia", oggi: 0, totalePrec: 0, annoScorso: 0 },
        turchia: { name: "Turchia", oggi: 0, totalePrec: 0, annoScorso: 0 },
        italia: { name: "Italia", oggi: 0, totalePrec: 0, annoScorso: 0, isAuto: true }
    };

    let dati = JSON.parse(localStorage.getItem('brogliaccio_dati_v1')) || JSON.parse(JSON.stringify(defaultData));

    // Analizza le stringhe di input (accetta sia virgola che punto come decimale)
    function parseNum(val) {
        if (!val) return 0;
        if (typeof val === 'number') return val;
        let pulito = val.toString().replace(/\./g, '').replace(',', '.').trim();
        let num = parseFloat(pulito);
        return isNaN(num) ? 0 : num;
    }

    // Calcola l'Italia e la differenza per ogni filiale senza ridisegnare l'HTML
    function calcolaEAggiornaDOM() {
        // 1. Ricalcolo automatico ITALIA = Brogliaccio - (Spagna + 2IG + Russia + Turchia)
        const esteriOggi = dati.spagna.oggi + dati.ig2.oggi + dati.russia.oggi + dati.turchia.oggi;
        const esteriPrec = dati.spagna.totalePrec + dati.ig2.totalePrec + dati.russia.totalePrec + dati.turchia.totalePrec;
        const esteriAnnoScorso = dati.spagna.annoScorso + dati.ig2.annoScorso + dati.russia.annoScorso + dati.turchia.annoScorso;

        dati.italia.oggi = dati.brogliaccio.oggi - esteriOggi;
        dati.italia.totalePrec = dati.brogliaccio.totalePrec - esteriPrec;
        // Per l'anno scorso dell'Italia, se non è inserito a mano, possiamo derivarlo o lasciarlo indipendente. Lo deriviamo dal totale brogliaccio!
        dati.italia.annoScorso = dati.brogliaccio.annoScorso - esteriAnnoScorso;

        // 2. Aggiornamento selettivo delle celle nel DOM (Zero perdita di focus!)
        for (const [key, item] of Object.entries(dati)) {
            const totAccumulato = item.totalePrec + item.oggi;
            const diff = totAccumulato - item.annoScorso;

            // Aggiorna cella Totale Accumulato
            const cellTot = document.getElementById(`tot-${key}`);
            if (cellTot) cellTot.textContent = currFmt.format(totAccumulato);

            // Aggiorna input Italia se è disabilitato (auto)
            if (key === 'italia') {
                const inpOggi = document.getElementById(`oggi-italia`);
                const inpAnno = document.getElementById(`anno-italia`);
                if (inpOggi) inpOggi.value = numFmt.format(item.oggi);
                if (inpAnno) inpAnno.value = numFmt.format(item.annoScorso);
            }

            // Aggiorna cella Confronto / Differenza
            const cellDiff = document.getElementById(`diff-${key}`);
            if (cellDiff) {
                let diffStr = currFmt.format(diff);
                if (diff > 0) {
                    diffStr = "+" + diffStr;
                    cellDiff.className = "diff-cell positive";
                } else if (diff < 0) {
                    cellDiff.className = "diff-cell negative";
                } else {
                    cellDiff.className = "diff-cell neutral";
                }
                cellDiff.textContent = diffStr;
            }
        }

        // Salvataggio silenzioso in background ad ogni modifica
        localStorage.setItem('brogliaccio_dati_v1', JSON.stringify(dati));
    }

    // Gestore di digitazione nei campi di input
    function handleInput(key, campo, valoreRaw) {
        dati[key][campo] = parseNum(valoreRaw);
        calcolaEAggiornaDOM();
    }

    // Formatta bene il numero all'uscita dalla casella (onblur)
    function handleBlur(inputElem, key, campo) {
        inputElem.value = numFmt.format(dati[key][campo]);
    }

    // Permette di rettificare il totale precedente cliccando sulla cella
    function rettificaTotale(key) {
        const item = dati[key];
        const attuale = item.totalePrec;
        const input = prompt(`Rettifica il Totale Accumulato precedente per "${item.name}":\n(Questo valore si somma all'importo di Oggi)`, numFmt.format(attuale));
        
        if (input !== null) {
            item.totalePrec = parseNum(input);
            calcolaEAggiornaDOM();
            mostraStatus(`Totale di ${item.name} rettificato con successo.`, 'success');
        }
    }

    // Generazione della tabella iniziale
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        const ordine = ['brogliaccio', 'spagna', 'ig2', 'russia', 'turchia', 'italia'];

        ordine.forEach(key => {
            const item = dati[key];
            const tr = document.createElement('tr');
            if (item.isMaster) tr.className = "row-master";
            if (item.isAuto) tr.className = "row-auto";

            const nameHtml = item.isAuto ? `${item.name} <span class="badge-auto">AUTO</span>` : item.name;
            const disOggi = item.isAuto ? "disabled" : "";
            const disAnno = item.isAuto ? "disabled" : ""; // Anno scorso Italia derivato automaticamente

            tr.innerHTML = `
                <td>${nameHtml}</td>
                <td>
                    <input type="text" id="oggi-${key}" ${disOggi}
                        value="${numFmt.format(item.oggi)}" 
                        onfocus="this.select()" 
                        oninput="handleInput('${key}', 'oggi', this.value)"
                        onblur="handleBlur(this, '${key}', 'oggi')">
                </td>
                <td class="totale-cell" id="tot-${key}" onclick="rettificaTotale('${key}')">
                    ${currFmt.format(item.totalePrec + item.oggi)}
                </td>
                <td>
                    <input type="text" id="anno-${key}" ${disAnno}
                        value="${numFmt.format(item.annoScorso)}" 
                        onfocus="this.select()" 
                        oninput="handleInput('${key}', 'annoScorso', this.value)"
                        onblur="handleBlur(this, '${key}', 'annoScorso')">
                </td>
                <td class="diff-cell" id="diff-${key}">€ 0,00</td>
            `;
            tbody.appendChild(tr);
        });

        calcolaEAggiornaDOM();
    }

    // Chiusura Giornata: Somma "Oggi" al Totale Precedente e azzera "Oggi"
    function chiudiGiornata() {
        if (!confirm("Confermi la Chiusura Giornata?\nGli importi di 'Oggi' verranno sommati definitivamente al 'Totale Accumulato' e le caselle di Oggi saranno azzerate.")) {
            return;
        }

        for (const [key, item] of Object.entries(dati)) {
            item.totalePrec += item.oggi;
            item.oggi = 0;
        }

        salvaDati(false);
        renderTable();
        mostraStatus("Giornata chiusa con successo! Importi accumulati e caselle azzerate.", "success");
    }

    // Copia per Email (Genera testo formattato in colonne pulite)
    function copiaPerEmail() {
        let testo = "RIEPILOGO FATTURATO E CONFRONTO STORICO\n";
        testo += "=================================================================\n";
        testo += "FILIALE / UNITÀ    | OGGI (€)      | TOT. ACCUM. (€)| DIFF. ANNO SCORSO\n";
        testo += "-------------------|---------------|----------------|------------------\n";

        const ordine = ['brogliaccio', 'italia', 'spagna', 'ig2', 'russia', 'turchia'];
        
        ordine.forEach(key => {
            const item = dati[key];
            const tot = item.totalePrec + item.oggi;
            const diff = tot - item.annoScorso;
            
            let nome = item.name.padEnd(18, ' ');
            let oggiStr = numFmt.format(item.oggi).padStart(13, ' ');
            let totStr = numFmt.format(tot).padStart(14, ' ');
            
            let diffStr = currFmt.format(diff);
            if (diff > 0) diffStr = "+" + diffStr;
            diffStr = diffStr.padStart(16, ' ');

            testo += `${nome} | ${oggiStr} | ${totStr} | ${diffStr}\n`;
            if (key === 'brogliaccio') testo += "-------------------|---------------|----------------|------------------\n";
        });

        testo += "=================================================================\n";

        navigator.clipboard.writeText(testo).then(() => {
            mostraStatus("📋 Tabella copiata negli appunti! Ora puoi incollarla direttamente nell'email o su WhatsApp.", "success");
        }).catch(() => {
            alert("Impossibile copiare automaticamente. Il browser ha bloccato l'azione.");
        });
    }

    function salvaDati(mostraNotifica = true) {
        localStorage.setItem('brogliaccio_dati_v1', JSON.stringify(dati));
        if (mostraNotifica) mostraStatus("💾 Dati salvati con successo nella memoria del browser!", "success");
    }

    function resetDati() {
        if (confirm("ATTENZIONE: Vuoi davvero azzerare tutti i dati e ricominciare da zero?")) {
            dati = JSON.parse(JSON.stringify(defaultData));
            salvaDati(false);
            renderTable();
            mostraStatus("Dati ripristinati a zero.", "negative");
        }
    }

    function mostraStatus(msg, tipo) {
        const div = document.getElementById('status');
        div.textContent = msg;
        div.style.color = tipo === 'success' ? '#27ae60' : '#c0392b';
        setTimeout(() => { div.textContent = ""; }, 5000);
    }

    // Avvio iniziale all'apertura della pagina
    window.onload = () => {
        renderTable();
    };
</script>

</body>
</html>
